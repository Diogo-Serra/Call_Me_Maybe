[project]
name = "Call_me_maybe"
version = "0.1.1"
description = "Function calling app with small text-generation LLM"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.2.2",
    "accelerate>=1.14.0",
    "numpy<=2.5.0",
    "pydantic>=2.13.4",
    "flake8>=7.0.0",
    "mypy>=1.10.0",
    "llm-sdk>=1.0.1",
]

[tool.mypy]
exclude = [".venv/", "src/data/", "src/llm_sdk/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
