[project]
name = "Call_me_maybe"
version = "0.1.1"
description = "Function calling app with small local LLM"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.2.2",
    "accelerate>=1.14.0",
    "numpy<=2.5.0",
    "pydantic>=2.13.4",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "flake8>=7.0.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
